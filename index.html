<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的愛之語小冒險｜新版十題</title>
<style>
:root{--ink:#493f51;--pink:#ffe3e8;--peach:#ffead8;--yellow:#fff3c8;--mint:#dff5e9;--lav:#e9e3ff;--paper:#fffdf9;--accent:#8d72c7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#fff1e8,#fff8f5 45%,#f0edff);font-family:ui-rounded,"Noto Sans TC",system-ui,sans-serif;color:var(--ink);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:18px}.app{width:min(100%,540px);background:rgba(255,253,249,.94);border:2px solid #fff;border-radius:30px;box-shadow:0 18px 55px #8a71951b;padding:clamp(22px,5vw,36px);position:relative;overflow:hidden}.spark{position:absolute;font-size:28px;opacity:.75}.s1{top:20px;right:25px}.s2{top:80px;left:22px}.hero{text-align:center;padding:16px 0 8px}.emoji{font-size:76px;line-height:1.25}.eyebrow{font-size:13px;letter-spacing:2px;color:#927db3;font-weight:800}.hero h1{font-size:clamp(28px,7vw,38px);margin:12px 0 10px;line-height:1.25}.hero p{line-height:1.8;color:#746b7d;margin:10px auto 22px;max-width:360px}.btn{border:0;border-radius:18px;padding:15px 22px;font-size:17px;font-weight:800;cursor:pointer;background:var(--accent);color:white;box-shadow:0 5px 0 #6f58a7;transition:transform .12s}.btn:active,.choice:active{transform:translateY(2px);box-shadow:none}.secondary{background:#f0ebfb;color:#6b5890;box-shadow:none}.full{width:100%}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:#89799e;margin:4px 0 12px}.track{height:9px;background:#eee8f3;border-radius:99px;overflow:hidden;margin-bottom:25px}.fill{height:100%;background:linear-gradient(90deg,#ffb9c9,#a995e8);width:0%;transition:width .25s}.q-emoji{text-align:center;font-size:54px;margin:8px 0 12px}.question{text-align:center;font-size:clamp(22px,5.7vw,29px);line-height:1.45;margin:0 0 22px}.choices{display:grid;gap:12px}.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:2px solid #f0eaf3;border-radius:20px;background:#fff;padding:16px;min-height:94px;color:var(--ink);font:inherit;cursor:pointer;transition:.15s}.choice .icon{font-size:35px;width:48px;text-align:center;flex-shrink:0}.choice .label{font-weight:750;font-size:17px;line-height:1.5}.choice .sub{display:block;font-size:13px;font-weight:500;color:#887d91;margin-top:3px}.choice.selected{border-color:#9c83d3;background:#f5f0ff;box-shadow:0 0 0 3px #e9e0ff}.nav{display:flex;gap:10px;margin-top:20px}.nav .btn{flex:1}.hint{text-align:center;font-size:12px;color:#9a8da0;margin-top:14px}.result{text-align:center}.result .emoji{font-size:70px}.result h2{font-size:30px;margin:8px 0}.result .lead{font-size:16px;line-height:1.8;color:#72677c}.result-card{border-radius:22px;padding:20px;margin:20px 0;text-align:left;background:var(--lav)}.result-card h3{margin:0 0 8px;font-size:19px}.result-card p{margin:0;line-height:1.8}.bars{display:grid;gap:10px;margin-top:16px}.barrow{display:grid;grid-template-columns:92px 1fr 22px;gap:8px;align-items:center;font-size:13px}.barbg{height:9px;background:#ffffffb8;border-radius:99px;overflow:hidden}.barfill{height:100%;background:#967fd0;border-radius:99px}.small{font-size:12px;line-height:1.7;color:#8b8090}.foot{text-align:center;font-size:11px;color:#a195a5;margin-top:20px}@media(max-width:380px){body{padding:8px}.app{padding:20px 16px}.choice{padding:13px;min-height:85px}.choice .label{font-size:16px}}
</style></head>
<body><main class="app"><span class="spark s1">✦</span><span class="spark s2">♡</span>
<section id="welcome" class="hero"><div class="emoji">💗🌈</div><div class="eyebrow">A LITTLE LOVE DISCOVERY</div><h1>我的愛之語<br>小冒險</h1><p>每個人感受到愛的方式都不一樣！<br>來選選看，哪些事情會讓你覺得最幸福？</p><button class="btn full" id="start">開始小冒險 ✨</button><p class="small">沒有對錯答案喔！選你現在最喜歡的就好。</p></section>
<section id="quiz" class="hidden"><div class="topline"><span id="counter">第 1 題 / 共 10 題</span><span>💖 愛的探索中</span></div><div class="track"><div id="progress" class="fill"></div></div><div class="q-emoji" id="qEmoji">🌟</div><h2 class="question" id="question"></h2><div class="choices" id="choices" aria-live="polite"></div><div class="nav"><button class="btn secondary" id="back">← 上一題</button><button class="btn" id="next" disabled>下一題 →</button></div><div class="hint">選一個最像你心裡想法的答案</div></section>
<section id="result" class="result hidden"><div class="emoji" id="resultEmoji">💞</div><div class="eyebrow">YOUR LOVE DISCOVERY</div><h2>你的愛之語是……</h2><h2 id="resultTitle"></h2><p class="lead" id="resultLead"></p><div class="result-card" id="tipCard"><h3>🌷 大人可以試試看</h3><p id="tip"></p></div><div class="result-card" style="background:#fff1d8"><h3>🌈 你的愛之語小地圖</h3><p class="small">這是你這次的選擇分布，不是固定標籤喔！</p><div class="bars" id="bars"></div></div><p class="small">愛可以有很多種表達方式！結果只是聊天的小線索，每個孩子也可能同時喜歡好幾種愛。</p><button class="btn full" id="again">再玩一次 ↻</button></section>
<div class="foot">給每個孩子的溫柔小發現 ♡</div></main>
<script>
const categories={words:{name:'肯定的言語',emoji:'💬',desc:'聽見鼓勵、稱讚和溫柔的話，會讓你感覺被看見、被愛。',tip:'具體說出你欣賞孩子的地方，例如：「我看到你很努力，謝謝你願意試試看。」',color:'#ffe3e8'},time:{name:'精心的陪伴',emoji:'🧩',desc:'有人放下手邊的事，專心和你一起玩、一起聊，會讓你覺得很幸福。',tip:'每天安排一小段專屬時間，讓孩子選遊戲；大人把手機放下，專心陪伴。',color:'#dff5e9'},gifts:{name:'接受禮物',emoji:'🎁',desc:'一份特別為你準備的小驚喜，會讓你感覺對方有想到你、記得你。',tip:'不需要買昂貴的東西，可以送一張手繪卡片、一片特別的葉子，並說說為什麼想到孩子。',color:'#fff3c8'},acts:{name:'服務的行動',emoji:'🤲',desc:'有人注意到你的需要，主動幫你一把，會讓你感覺被照顧。',tip:'在孩子需要時提供適度協助，例如一起整理材料；也可以邀請孩子一起照顧家人。',color:'#e9e3ff'},touch:{name:'身體的接觸',emoji:'🤗',desc:'在你願意的時候，一個擁抱、牽手或輕拍背部，會讓你感覺安心。',tip:'先問孩子「你想要抱抱、擊掌，還是坐在旁邊？」尊重孩子的身體界線和選擇。',color:'#ffe8d8'}};
const questions=[
{e:'💬',q:'哪一件事會讓你覺得自己很棒、很被愛？',a:[['words','聽到我說：「我看到你很努力，我真的替你開心！」'],['time','我放下手邊的事，專心陪你玩一個你喜歡的遊戲。']]},
{e:'🎁',q:'哪一種貼心的方式會讓你更開心？',a:[['gifts','發現有人特別為你準備了一份小驚喜，可能是一張小卡或小禮物。'],['acts','發現有人幫你把很難整理的東西準備好，讓你輕鬆一些。']]},
{e:'🤗',q:'當你需要感受到愛時，你比較喜歡哪一種？',a:[['touch','在你願意的時候，我抱抱你或牽牽你的手。'],['words','我看著你，溫柔地告訴你：「我在這裡，你對我很重要。」']]},
{e:'🧩',q:'哪一件事會讓你感覺特別幸福？',a:[['time','和我一起做你最喜歡的活動，而且這段時間只專心陪你。'],['gifts','收到一份我特別挑選、因為想到你才準備的小禮物。']]},
{e:'🌷',q:'當你有事情需要幫忙時，哪一種方式比較貼近你的心意？',a:[['acts','有人主動幫你準備好需要的東西，讓事情變得容易一點。'],['touch','在你想要的時候，有人給你一個溫暖的抱抱或牽牽手。']]},
{e:'⭐',q:'哪一種小事會讓你覺得自己被放在心上？',a:[['words','聽到我說出你做得很棒的地方，以及我欣賞你的努力。'],['gifts','我把你的作品好好收藏，或特別做成一張小卡送給你。']]},
{e:'🧸',q:'當你遇到困難時，你比較希望怎麼陪你一起度過？',a:[['time','坐在你旁邊，和你一起慢慢想辦法、一起試試看。'],['acts','看見你卡住的地方，主動幫你完成那個讓你很困擾的步驟。']]},
{e:'🌈',q:'哪一種方式會讓你感覺「有人一直記得我」？',a:[['gifts','收到一個小小的紀念品，知道我在不在你身邊時都想到你。'],['touch','在你願意的時候，得到一個大大的歡迎抱抱或牽手。']]},
{e:'💖',q:'當你要嘗試一件新事情時，你最希望得到什麼？',a:[['words','聽到我說：「我相信你！不管結果如何，我都看見你願意嘗試。」'],['acts','我幫你把需要的東西準備好，陪你把開始前的事情安排妥當。']]},
{e:'🌧️',q:'如果你今天心情不太好，你比較希望哪一種方式讓你感覺被愛？',a:[['time','我先放下手邊的事，專心陪你聊聊，或一起做一件你喜歡的事。'],['touch','在你想要的時候，我給你一個溫暖的抱抱，或牽著你的手陪你。']]}
];
let idx=0,answers=Array(questions.length).fill(null);const $=id=>document.getElementById(id);function show(id){['welcome','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function render(){const q=questions[idx];$('counter').textContent=`第 ${idx+1} 題 / 共 ${questions.length} 題`;$('progress').style.width=`${(idx+1)/questions.length*100}%`;$('qEmoji').textContent=q.e;$('question').textContent=q.q;$('choices').innerHTML='';q.a.forEach(([key,label],j)=>{const b=document.createElement('button');b.className='choice'+(answers[idx]===key?' selected':'');b.innerHTML=`<span class="icon">${['🌟','💗'][j]}</span><span class="label">${label}<span class="sub">${j===0?'我會喜歡這個':'這個也很棒！'}</span></span>`;b.onclick=()=>{answers[idx]=key;render();$('choices').querySelectorAll('button').forEach(x=>x.disabled=true);window.setTimeout(()=>{if(idx<questions.length-1){idx++;render()}else{result()}},280)};$('choices').appendChild(b)});$('back').disabled=idx===0;$('back').style.opacity=idx===0?'.45':'1';$('next').disabled=answers[idx]===null;$('next').textContent=idx===questions.length-1?'看看我的結果 ✨':'下一題 →'}function result(){let score={words:0,time:0,gifts:0,acts:0,touch:0};answers.forEach(x=>{if(x)score[x]++});const max=Math.max(...Object.values(score));let winners=Object.keys(score).filter(k=>score[k]===max);const key=winners[0],c=categories[key];$('resultEmoji').textContent=winners.length>1?'💖':c.emoji;$('resultTitle').textContent=winners.length>1?'你有好多種愛的方式！':c.name;$('resultLead').textContent=winners.length>1?`這次你對「${winners.map(k=>categories[k].name).join('」和「')}」都投下了喜歡的一票。你可能同時喜歡不同方式的愛喔！`:c.desc;$('tip').textContent=winners.length>1?'可以試著問孩子：「什麼時候你最有被愛的感覺？」一起發現他喜歡的方式。':c.tip;$('bars').innerHTML='';Object.keys(score).sort((a,b)=>score[b]-score[a]).forEach(k=>{const row=document.createElement('div');row.className='barrow';row.innerHTML=`<span>${categories[k].emoji} ${categories[k].name}</span><div class="barbg"><div class="barfill" style="width:${score[k]/questions.length*100}%;background:#967fd0"></div></div><b>${score[k]}</b>`;$('bars').appendChild(row)});show('result')}
$('start').onclick=()=>{idx=0;answers.fill(null);show('quiz');render()};$('next').onclick=()=>{if(answers[idx]===null)return;if(idx<questions.length-1){idx++;render()}else result()};$('back').onclick=()=>{if(idx>0){idx--;render()}};$('again').onclick=()=>{idx=0;answers.fill(null);show('welcome')};
</script></body></html>
